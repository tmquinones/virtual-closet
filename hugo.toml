baseURL = "https://tmquinones.github.io/virtual-closet/"
languageCode = "en-us"
title = "Virtual Closet"
theme = ""

# IMPORTANT: change baseURL above after you create your repo.
# If your repo is named the same as your username (e.g. yourname.github.io),
# set baseURL = "https://yourname.github.io/" instead.

[params]
  description = "A curated digital wardrobe."
  author      = "ChrTif"
  brandMark   = "VC"

[markup]
  [markup.goldmark.renderer]
    unsafe = true   # allow raw HTML in markdown (for image grids etc.)

[menu]
  [[menu.main]]
    name   = "Home"
    url    = "/"
    weight = 1
  [[menu.main]]
    name   = "Categories"
    url    = "/categories/"
    weight = 2
  [[menu.main]]
    name   = "Seasons"
    url    = "/seasons/"
    weight = 3
  [[menu.main]]
    name   = "Colors"
    url    = "/colors/"
    weight = 4
  [[menu.main]]
    name   = "Outfits"
    url    = "/outfits/"
    weight = 5

[taxonomies]
  category = "categories"
  season   = "seasons"
  color    = "colors"
  brand    = "brands"
