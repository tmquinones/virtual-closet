<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tmquinones · Virtual Closet</title>
  <link rel="stylesheet" href="../styles.css?v=lb1">
  <link rel="stylesheet" href="../editorial.css?v=lb1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <meta name="theme-color" content="#1c1c1c">
  <style>
    /* Lookbook-only styles — keep palette consistent with main app */
    .lb-app { min-height: 100vh; background: var(--bg, #fafaf7); }
    .lb-header {
      position: sticky; top: 0; z-index: 50;
      background: #fff; border-bottom: 1px solid #e8e6e1;
      padding: 14px 20px; display: flex; align-items: center; gap: 16px;
    }
    .lb-brand { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
    .lb-mark {
      width: 38px; height: 38px; background: #1c1c1c; color: #fff;
      border-radius: 4px; display: grid; place-items: center;
      font-family: 'Playfair Display', serif; font-weight: 600; font-size: 1rem;
    }
    .lb-title { font-family: 'Playfair Display', serif; font-size: 1.1rem; font-weight: 600; line-height: 1.1; }
    .lb-subtitle { font-size: 0.78rem; color: #6b6b6b; }
    .lb-stats { font-size: 0.85rem; color: #6b6b6b; white-space: nowrap; }
    .lb-stats strong { color: #1c1c1c; }
    .lb-tabs {
      background: #fff; border-bottom: 1px solid #e8e6e1;
      padding: 8px 20px; display: flex; gap: 4px; overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .lb-tabs::-webkit-scrollbar { display: none; }
    .lb-tab {
      flex-shrink: 0; padding: 8px 14px; border: 1px solid #e8e6e1;
      background: #fff; color: #1c1c1c; border-radius: 999px;
      font-size: 0.85rem; cursor: pointer; transition: all .15s;
      font-family: inherit;
    }
    .lb-tab:hover { border-color: #1c1c1c; }
    .lb-tab.active { background: #1c1c1c; color: #fff; border-color: #1c1c1c; }

    .lb-grid {
      padding: 20px; max-width: 1400px; margin: 0 auto;
      display: grid; gap: 14px;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    }
    @media (min-width: 600px) { .lb-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px; } }

    .lb-card {
      background: #fff; border: 1px solid #e8e6e1; border-radius: 4px;
      overflow: hidden; cursor: pointer; transition: transform .15s, border-color .15s;
    }
    .lb-card:hover { border-color: #1c1c1c; transform: translateY(-2px); }
    .lb-card-img { aspect-ratio: 3/4; background: #f1efe9 center/cover no-repeat; }
    .lb-card-body { padding: 10px 12px 12px; }
    .lb-card-name { font-weight: 500; font-size: 0.92rem; line-height: 1.3; }
    .lb-card-brand { font-size: 0.75rem; color: #6b6b6b; margin-top: 2px; }
    .lb-card-meta { font-size: 0.72rem; color: #6b6b6b; margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; }
    .lb-card-meta span { display: inline-flex; align-items: center; }
    .lb-card-color::before { content: "●"; margin-right: 4px; }
    .lb-card-price { font-weight: 600; color: #1c1c1c; }

    .lb-empty {
      text-align: center; padding: 80px 24px; color: #6b6b6b;
    }
    .lb-empty h2 { font-family: 'Playfair Display', serif; font-weight: 500; }

    /* Detail modal */
    .lb-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
    .lb-modal.open { display: flex; }
    .lb-modal-panel { background: #fff; border-radius: 4px; max-width: 560px; width: 100%; max-height: 90vh; overflow: auto; position: relative; }
    .lb-modal-close { position: absolute; top: 8px; right: 12px; background: none; border: none; font-size: 28px; cursor: pointer; color: #6b6b6b; }
    .lb-modal-img { width: 100%; aspect-ratio: 3/4; background: #f1efe9 center/cover no-repeat; }
    .lb-modal-body { padding: 20px 24px 28px; }
    .lb-modal-name { font-family: 'Playfair Display', serif; font-size: 1.4rem; font-weight: 600; margin: 0 0 4px; }
    .lb-modal-brand { color: #6b6b6b; margin-bottom: 14px; }
    .lb-modal-meta { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; font-size: 0.92rem; }
    .lb-modal-meta dt { color: #6b6b6b; text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.1em; padding-top: 3px; }
    .lb-modal-meta dd { margin: 0; }
    .lb-modal-notes { margin-top: 14px; padding-top: 14px; border-top: 1px solid #e8e6e1; font-size: 0.92rem; line-height: 1.5; color: #2a2a2a; }

    .lb-loading { text-align: center; padding: 80px 24px; color: #6b6b6b; }

    .lb-footer {
      padding: 30px 20px; text-align: center; color: #6b6b6b;
      font-size: 0.78rem; border-top: 1px solid #e8e6e1; margin-top: 40px;
    }
  </style>
</head>
<body>
  <div class="lb-app">
    <header class="lb-header">
      <div class="lb-brand">
        <div class="lb-mark">VC</div>
        <div>
          <div class="lb-title">Virtual Closet</div>
          <div class="lb-subtitle" id="lbSubtitle">tmquinones</div>
        </div>
      </div>
      <div class="lb-stats" id="lbStats"></div>
    </header>

    <nav class="lb-tabs" id="lbTabs"></nav>

    <main id="lbMain">
      <div class="lb-loading">Loading wardrobe…</div>
    </main>

    <footer class="lb-footer">
      Public lookbook · auto-updated daily ·
      <a href="../" style="color: inherit;">main app →</a>
    </footer>
  </div>

  <div class="lb-modal" id="lbModal">
    <div class="lb-modal-panel" id="lbModalPanel">
      <button class="lb-modal-close" aria-label="Close" id="lbModalClose">×</button>
      <div class="lb-modal-img" id="lbModalImg"></div>
      <div class="lb-modal-body" id="lbModalBody"></div>
    </div>
  </div>

  <script>
  (async function() {
    const DATA_URL = '../data/backup-latest.json?ts=' + Date.now();
    const main = document.getElementById('lbMain');
    const tabs = document.getElementById('lbTabs');
    const stats = document.getElementById('lbStats');

    let DATA = null;
    let activeFilter = { kind: 'all', value: null };

    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }
    function priceStr(it) {
      if (it.purchasePrice != null && it.purchasePrice !== '') {
        return '$' + Number(it.purchasePrice).toFixed(0);
      }
      return '';
    }

    function activeItems(items) {
      // Hide returned/sold from public view
      return (items || []).filter(it => it.status !== 'returned' && it.status !== 'sold');
    }

    function renderTabs() {
      const items = activeItems(DATA.items);
      const cats = new Map();
      const cols = new Map();
      const seasons = new Map();
      items.forEach(it => {
        const c = it.garmentType;
        if (c) cats.set(c, (cats.get(c) || 0) + 1);
        const col = it.color;
        if (col) cols.set(col, (cols.get(col) || 0) + 1);
        const ss = it.seasons || it.season;
        if (Array.isArray(ss)) ss.forEach(s => seasons.set(s, (seasons.get(s) || 0) + 1));
      });
      const labelGT = (g) => ({
        tops: 'Tops', bottoms: 'Bottoms', dresses: 'Dresses',
        outerwear: 'Outerwear', shoes: 'Shoes', accessories: 'Accessories',
        intimates: 'Intimates & Swim', activewear: 'Activewear'
      }[g] || (g ? g[0].toUpperCase() + g.slice(1) : g));
      const order = ['tops','bottoms','dresses','outerwear','shoes','accessories','intimates'];
      const sortedCats = Array.from(cats.entries()).sort((a,b) => {
        const ai = order.indexOf(a[0]); const bi = order.indexOf(b[0]);
        if (ai === -1 && bi === -1) return b[1] - a[1];
        if (ai === -1) return 1; if (bi === -1) return -1;
        return ai - bi;
      });
      const buttons = [
        `<button class="lb-tab ${activeFilter.kind === 'all' ? 'active' : ''}" data-filter="all">All (${items.length})</button>`
      ];
      sortedCats.forEach(([g, n]) => {
        buttons.push(`<button class="lb-tab ${activeFilter.kind==='cat' && activeFilter.value===g ? 'active':''}" data-filter="cat" data-val="${escapeHtml(g)}">${escapeHtml(labelGT(g))} (${n})</button>`);
      });
      tabs.innerHTML = buttons.join('');
      tabs.querySelectorAll('.lb-tab').forEach(b => {
        b.addEventListener('click', () => {
          activeFilter = { kind: b.dataset.filter, value: b.dataset.val || null };
          renderTabs(); renderGrid();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      });
    }

    function filterItems() {
      const items = activeItems(DATA.items);
      if (activeFilter.kind === 'all') return items;
      if (activeFilter.kind === 'cat') return items.filter(i => i.garmentType === activeFilter.value);
      return items;
    }

    function cardHtml(it, idx) {
      const photo = it.photo || it.thumb || '';
      const price = priceStr(it);
      const meta = [];
      if (it.color) meta.push(`<span class="lb-card-color">${escapeHtml(it.color)}</span>`);
      if (price) meta.push(`<span class="lb-card-price">${price}</span>`);
      return `
        <div class="lb-card" data-idx="${idx}">
          <div class="lb-card-img" ${photo ? `style="background-image:url('${photo.replace(/'/g, "\\'")}');"` : ''}></div>
          <div class="lb-card-body">
            <div class="lb-card-name">${escapeHtml(it.name || '(untitled)')}</div>
            ${it.brand ? `<div class="lb-card-brand">${escapeHtml(it.brand)}</div>` : ''}
            ${meta.length ? `<div class="lb-card-meta">${meta.join(' · ')}</div>` : ''}
          </div>
        </div>
      `;
    }

    function renderGrid() {
      const items = filterItems();
      if (!items.length) {
        main.innerHTML = `<div class="lb-empty"><h2>Nothing here yet</h2><p>This category is empty.</p></div>`;
        return;
      }
      main.innerHTML = `<div class="lb-grid">${items.map((it, idx) => cardHtml(it, idx)).join('')}</div>`;
      main.querySelectorAll('.lb-card').forEach(c => {
        c.addEventListener('click', () => openDetail(items[Number(c.dataset.idx)]));
      });
    }

    function openDetail(it) {
      const modal = document.getElementById('lbModal');
      const img = document.getElementById('lbModalImg');
      const body = document.getElementById('lbModalBody');
      const photo = it.photo || it.thumb || '';
      img.style.backgroundImage = photo ? `url('${photo.replace(/'/g, "\\'")}')` : 'none';
      const meta = [];
      if (it.color) meta.push(['Color', it.color]);
      if (it.size) meta.push(['Size', it.size]);
      if (it.subtype) meta.push(['Type', it.subtype]);
      if (Array.isArray(it.seasons) && it.seasons.length) meta.push(['Seasons', it.seasons.join(', ')]);
      if (it.purchasePrice != null && it.purchasePrice !== '') meta.push(['Price', '$' + Number(it.purchasePrice).toFixed(2)]);
      if (it.purchaseDate) meta.push(['Purchased', it.purchaseDate]);
      const metaHtml = meta.map(([k,v]) => `<dt>${escapeHtml(k)}</dt><dd>${escapeHtml(v)}</dd>`).join('');
      body.innerHTML = `
        <h1 class="lb-modal-name">${escapeHtml(it.name || '(untitled)')}</h1>
        ${it.brand ? `<div class="lb-modal-brand">${escapeHtml(it.brand)}</div>` : ''}
        <dl class="lb-modal-meta">${metaHtml}</dl>
        ${it.notes ? `<div class="lb-modal-notes">${escapeHtml(it.notes)}</div>` : ''}
      `;
      modal.classList.add('open');
    }
    document.getElementById('lbModalClose').addEventListener('click', () => {
      document.getElementById('lbModal').classList.remove('open');
    });
    document.getElementById('lbModal').addEventListener('click', (e) => {
      if (e.target.id === 'lbModal') e.target.classList.remove('open');
    });

    // ===== Boot =====
    try {
      const res = await fetch(DATA_URL, { cache: 'no-cache' });
      if (!res.ok) throw new Error('No backup found yet (HTTP ' + res.status + '). Set up GitHub Sync in the main app.');
      DATA = await res.json();
      const items = activeItems(DATA.items);
      const brands = new Set(items.map(i => i.brand).filter(Boolean));
      stats.innerHTML = `<strong>${items.length}</strong> pieces · <strong>${brands.size}</strong> brands`;
      const exportedAt = DATA.exportedAt ? new Date(DATA.exportedAt).toLocaleDateString() : '';
      if (exportedAt) document.getElementById('lbSubtitle').textContent = 'tmquinones · last updated ' + exportedAt;
      renderTabs();
      renderGrid();
    } catch (err) {
      main.innerHTML = `
        <div class="lb-empty">
          <h2>Lookbook is empty</h2>
          <p style="max-width: 460px; margin: 12px auto;">${escapeHtml(err.message)}</p>
          <p style="font-size: 0.85rem; max-width: 460px; margin: 12px auto;">Once you've configured GitHub Sync in the main app and your first backup is uploaded, this page will populate.</p>
          <a class="btn" href="../" style="display:inline-block; margin-top: 12px;">Open main app</a>
        </div>
      `;
    }
  })();
  </script>
</body>
</html>
