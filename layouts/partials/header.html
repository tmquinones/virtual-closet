<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ "/" | relURL }}">
      <span class="brand-mark">{{ .Site.Params.brandMark }}</span>
      <span class="brand-text">
        <span class="brand-title">{{ .Site.Title }}</span>
        <span class="brand-subtitle">{{ .Site.Params.description }}</span>
      </span>
    </a>
    <nav class="site-nav" aria-label="Primary">
      <input type="checkbox" id="nav-toggle" class="nav-toggle">
      <label for="nav-toggle" class="nav-toggle-label" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </label>
      <ul class="nav-list">
        {{ range .Site.Menus.main }}
          <li><a href="{{ .URL | relURL }}" {{ if $.IsMenuCurrent "main" . }}class="active"{{ end }}>{{ .Name }}</a></li>
        {{ end }}
      </ul>
    </nav>
  </div>
</header>
