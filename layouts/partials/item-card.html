<a class="card" href="{{ .RelPermalink }}">
  {{ with .Params.image }}
    <div class="card-img"><img src="{{ . | relURL }}" alt="{{ $.Title }}" loading="lazy"></div>
  {{ else }}
    <div class="card-img card-img-empty"><span>{{ substr $.Title 0 1 }}</span></div>
  {{ end }}
  <div class="card-body">
    <div class="card-title">{{ .Title }}</div>
    {{ with .Params.brand }}<div class="card-sub">{{ . }}</div>{{ end }}
  </div>
</a>
